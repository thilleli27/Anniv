<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Joyeux anniversaire Celena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400;1,6..96,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --wine: #5E0F23;
    --wine-deep: #3A0614;
    --wine-light: #7A1A32;
    --gold: #C8A35F;
    --gold-light: #EAD3A0;
    --cream: #FBF4E8;
    --ink: #4A0A1B;
    --muted-dark: #8A5A62;
    --muted: rgba(251,244,232,.7);
    color-scheme: dark;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; } }
  :root[data-theme="dark"] { color-scheme: dark; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background:
      radial-gradient(ellipse 85% 55% at 50% -10%, rgba(200,163,95,.22), transparent 62%),
      radial-gradient(ellipse 70% 60% at 50% 120%, rgba(0,0,0,.45), transparent 70%),
      linear-gradient(180deg, var(--wine) 0%, var(--wine-deep) 100%);
    background-attachment: fixed;
    color: var(--cream);
    font-family: "Jost", "Helvetica Neue", Arial, sans-serif;
    font-weight: 300;
    overflow-x: hidden;
  }
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .06;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  header { text-align: center; padding: clamp(2.5rem, 7vw, 5rem) 1.25rem 1.5rem; }
  .hello { font-weight: 400; font-size: 1.05rem; letter-spacing: .04em; color: var(--gold-light); }
  h1 {
    font-family: "Bodoni Moda", "Didot", Georgia, serif;
    font-weight: 400; font-style: italic;
    font-size: clamp(3rem, 12vw, 7.5rem);
    line-height: .9; margin: .7rem 0 1.1rem;
    background: linear-gradient(180deg, #F6E6C2 15%, var(--gold) 60%, #A07E3E 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .ornament { display: block; width: 7rem; margin: 0 auto 1.1rem; color: var(--gold); }
  .sub { max-width: 30rem; margin: 0 auto; font-size: 1.05rem; line-height: 1.6; color: var(--muted); }
  .progress { margin: 1.75rem auto 0; display: inline-flex; align-items: center; gap: .75rem; font-size: .95rem; color: var(--gold-light); }
  .bar { width: 9rem; height: 2px; background: rgba(234,211,160,.2); border-radius: 2px; overflow: hidden; }
  .bar span { display: block; height: 100%; width: 0; background: var(--gold); transition: width .6s ease; }

  main {
    max-width: 68rem; margin: 0 auto;
    padding: 1.5rem clamp(.9rem, 3vw, 2rem) 4rem;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 9.5rem), 1fr));
    gap: clamp(.9rem, 2.4vw, 1.6rem);
  }
  @media (max-width: 420px) { main { grid-template-columns: repeat(2, 1fr); } }

  .gift { position: relative; aspect-ratio: 3 / 4; perspective: 1100px; border: none; background: none; cursor: pointer; padding: 0; color: inherit; font: inherit; border-radius: 12px; }
  .gift:focus-visible { outline: 2px solid var(--gold); outline-offset: 5px; }
  .inner { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .9s cubic-bezier(.2,.8,.2,1); }
  .gift.open .inner { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }

  /* enveloppe crème, sceau bordeaux */
  .front {
    background: linear-gradient(165deg, #FFFBF3, #EFE3CF);
    box-shadow: inset 0 0 0 1px rgba(200,163,95,.7), 0 20px 40px -20px rgba(0,0,0,.75);
  }
  .front::before {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 52%;
    background: linear-gradient(180deg, #F7EEDD, #E8DAC0);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    filter: drop-shadow(0 1.5px 0 rgba(200,163,95,.8));
  }
  .seal {
    position: relative; z-index: 1; width: 3.7rem; height: 3.7rem; margin-top: -8%; border-radius: 50%;
    display: grid; place-items: center;
    background: radial-gradient(circle at 35% 30%, #A8314E, var(--wine) 50%, #2E0410);
    box-shadow: 0 4px 10px rgba(58,6,20,.45), inset 0 -3px 6px rgba(0,0,0,.35), inset 0 2px 3px rgba(255,255,255,.25), 0 0 0 3px rgba(94,15,35,.18);
    font-family: "Bodoni Moda", serif; font-weight: 600; font-size: 1.35rem; color: var(--gold-light);
    transition: transform .35s ease;
  }
  .gift:hover .seal { transform: scale(1.07) rotate(-6deg); }
  .hint { position: absolute; bottom: 1rem; left: 0; right: 0; text-align: center; font-family: "Bodoni Moda", serif; font-style: italic; font-size: .9rem; color: var(--wine); }

  /* carte révélée : bordeaux et or */
  .back {
    transform: rotateY(180deg);
    background: radial-gradient(circle at 50% 0%, var(--wine-light), var(--wine) 55%, var(--wine-deep));
    color: var(--cream);
    box-shadow: inset 0 0 0 7px transparent, inset 0 0 0 8px rgba(200,163,95,.75), 0 20px 40px -20px rgba(0,0,0,.75);
    padding: 1.1rem .9rem; text-align: center; gap: .55rem;
  }
  .back .num { font-family: "Bodoni Moda", serif; font-style: italic; font-size: .95rem; color: var(--gold); }
  .back .emoji { font-size: 2.3rem; line-height: 1; }
  .back .title { font-family: "Bodoni Moda", serif; font-weight: 500; font-size: clamp(1.05rem, 2.6vw, 1.3rem); line-height: 1.15; color: var(--gold-light); }
  .back .note { font-size: .82rem; line-height: 1.45; color: var(--muted); }

  footer { text-align: center; padding: 0 1rem 3rem; }
  .reset { background: none; border: 1px solid rgba(234,211,160,.35); color: var(--gold-light); font: inherit; font-size: .85rem; padding: .55rem 1.1rem; border-radius: 999px; cursor: pointer; }
  .reset:hover { border-color: var(--gold); }
  .reset:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

  .lock {
    position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 1.25rem;
    background: rgba(28,3,10,.72); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    opacity: 0; pointer-events: none; transition: opacity .3s ease;
  }
  .lock.show { opacity: 1; pointer-events: auto; }
  .lock-box {
    width: min(100%, 22rem); text-align: center; padding: 2rem 1.5rem 1.5rem; border-radius: 16px;
    background: radial-gradient(circle at 50% 0%, var(--wine-light), var(--wine) 60%, var(--wine-deep));
    box-shadow: inset 0 0 0 1px rgba(200,163,95,.7), 0 30px 60px -20px rgba(0,0,0,.8);
    transform: translateY(12px) scale(.97); transition: transform .35s cubic-bezier(.2,.8,.2,1);
  }
  .lock.show .lock-box { transform: none; }
  .lock-icon { font-size: 2rem; }
  .lock h2 { font-family: "Bodoni Moda", serif; font-style: italic; font-weight: 400; font-size: 1.7rem; color: var(--gold-light); margin: .4rem 0 .5rem; }
  .lock p { font-size: .95rem; line-height: 1.5; color: var(--muted); }
  .lock input {
    margin-top: 1.2rem; width: 100%; padding: .8rem 1rem; border-radius: 10px;
    border: 1px solid rgba(200,163,95,.55); background: rgba(0,0,0,.25); color: var(--cream);
    font: inherit; font-size: 1.2rem; text-align: center; letter-spacing: .3em;
  }
  .lock input::placeholder { color: rgba(251,244,232,.4); letter-spacing: .05em; }
  .lock input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(200,163,95,.25); }
  .err { min-height: 1.3rem; margin-top: .5rem; font-size: .85rem; color: #F2A7B6; }
  .lock-actions { display: flex; gap: .6rem; margin-top: .6rem; }
  .btn {
    flex: 1; padding: .75rem; border-radius: 999px; border: none; cursor: pointer; font: inherit; font-weight: 500;
    background: linear-gradient(180deg, #E5C987, var(--gold)); color: var(--wine-deep);
  }
  .btn.ghost { background: none; border: 1px solid rgba(234,211,160,.35); color: var(--gold-light); font-weight: 400; }
  .btn:focus-visible { outline: 2px solid var(--gold-light); outline-offset: 3px; }
  .shake { animation: shake .4s; }
  @keyframes shake { 0%,100% { transform: none; } 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }

  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 20; }
  @media (prefers-reduced-motion: reduce) { .inner, .seal, .bar span { transition: none; } }
</style>
</head>
<body>

<header>
  <p class="hello">Pour toi, Celena</p>
  <h1>Joyeux anniversaire</h1>
  <svg class="ornament" viewBox="0 0 112 12" aria-hidden="true"><path d="M0 6h46M66 6h46" stroke="currentColor" stroke-width=".8"/><path d="M56 1l5 5-5 5-5-5z" fill="none" stroke="currentColor" stroke-width=".8"/><circle cx="56" cy="6" r="1.4" fill="currentColor"/></svg>
  <p class="sub">Seize enveloppes, seize surprises. Touche un sceau pour l’ouvrir, dans l’ordre que tu veux.</p>
  <div class="progress" aria-live="polite">
    <div class="bar"><span id="bar"></span></div>
    <span id="count">0 sur 16 ouverts</span>
  </div>
</header>

<main id="grid"></main>

<footer><button class="reset" id="reset">Refermer toutes les enveloppes</button></footer>

<div class="lock" id="lock" role="dialog" aria-modal="true" aria-labelledby="lock-title">
  <div class="lock-box">
    <div class="lock-icon" aria-hidden="true">🔒</div>
    <h2 id="lock-title">Enveloppe scellée</h2>
    <p>Il te faut le code secret pour ouvrir celle-ci.</p>
    <input id="code" type="password" inputmode="numeric" autocomplete="off" placeholder="Code" aria-label="Code secret">
    <div class="err" id="err" aria-live="polite"></div>
    <div class="lock-actions">
      <button class="btn ghost" id="cancel">Plus tard</button>
      <button class="btn" id="ok">Ouvrir</button>
    </div>
  </div>
</div>

<canvas id="confetti"></canvas>

<script>
  // 🔐 Code secret pour les enveloppes verrouillées (à changer ici)
  const SECRET = "1973";

  const gifts = [
    { emoji: "🎁", title: "Le cadeau de Lydia",        note: "Une surprise de sa part" },
    { emoji: "🤫", title: "Une surprise organisée",    note: "Je ne t’en dis pas plus…" },
    { emoji: "🥂", title: "Une boisson",               note: "Pour trinquer à tes années" },
    { emoji: "🍫", title: "Des Kinder Cards",          note: "Ton petit plaisir" },
    { emoji: "🧦", title: "Des chaussettes maison",    note: "Douces et toutes chaudes pour la maison" },
    { emoji: "👟", title: "Des chaussettes du quotidien", note: "Pour tous les jours, partout avec toi" },
    { emoji: "🍲", title: "Ton plat préféré",          note: "Je te le cuisine, rien que pour toi" },
    { emoji: "🧤", title: "Des gants",                 note: "Pour avoir chaud aux mains cet hiver" },
    { emoji: "🎀", title: "Une pince",                 note: "Pour être encore plus belle" },
    { emoji: "🩴", title: "Des claquettes",            note: "Le confort à la maison" },
    { emoji: "💄", title: "Un blender éponge",         note: "Pour un teint parfait" },
    { emoji: "🧖‍♀️", title: "Un masque",                 note: "Moment détente, rien que pour toi" },
    { emoji: "🏡", title: "Ta fête d’anniversaire",    note: "On te fête chez nous, tout est prêt pour toi", locked: true },
    { emoji: "🎂", title: "Ton gâteau",                note: "Souffle fort, fais un vœu", locked: true },
    { emoji: "🎈", title: "La déco",                   note: "Ta journée mérite d’être décorée", locked: true },
    { emoji: "👑", title: "Le grand cadeau",           note: "Le meilleur pour la fin" }
  ];

  const KEY = "cadeaux-soeur-ouverts";
  let opened = new Set();
  try { opened = new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify([...opened])); } catch (e) {} };

  const grid = document.getElementById("grid");
  gifts.forEach((g, i) => {
    const b = document.createElement("button");
    b.className = "gift" + (opened.has(i) ? " open" : "");
    b.setAttribute("aria-label", opened.has(i) ? g.title : "Ouvrir l’enveloppe " + (i + 1));
    b.innerHTML = `
      <div class="inner">
        <div class="face front"><div class="seal">${i + 1}</div><div class="hint">${g.locked ? "🔒 Code secret" : "Ouvrir"}</div></div>
        <div class="face back">
          <div class="num">n° ${i + 1}</div>
          <div class="emoji">${g.emoji}</div>
          <div class="title">${g.title}</div>
          <div class="note">${g.note}</div>
        </div>
      </div>`;
    b.addEventListener("click", () => {
      if (opened.has(i)) return;
      if (g.locked) askCode(i, b, g); else reveal(i, b, g);
    });
    grid.appendChild(b);
  });

  function reveal(i, b, g) {
    opened.add(i); save();
    b.classList.add("open");
    b.setAttribute("aria-label", g.title);
    const r = b.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2, opened.size === gifts.length ? 220 : 70);
    update();
  }

  const modal = document.getElementById("lock"), input = document.getElementById("code"),
        err = document.getElementById("err"), box = modal.querySelector(".lock-box");
  let pending = null;
  function askCode(i, b, g) {
    pending = { i, b, g };
    input.value = ""; err.textContent = "";
    modal.classList.add("show");
    setTimeout(() => input.focus(), 50);
  }
  function closeModal() { modal.classList.remove("show"); pending = null; }
  function tryCode() {
    if (!pending) return;
    if (input.value.trim() === SECRET) {
      const { i, b, g } = pending; closeModal(); setTimeout(() => reveal(i, b, g), 200);
    } else {
      err.textContent = "Ce n’est pas le bon code";
      box.classList.remove("shake"); void box.offsetWidth; box.classList.add("shake");
      input.select();
    }
  }
  document.getElementById("ok").addEventListener("click", tryCode);
  document.getElementById("cancel").addEventListener("click", closeModal);
  input.addEventListener("keydown", e => { if (e.key === "Enter") tryCode(); if (e.key === "Escape") closeModal(); });
  modal.addEventListener("click", e => { if (e.target === modal) closeModal(); });

  function update() {
    document.getElementById("count").textContent = opened.size + " sur " + gifts.length + " ouverts";
    document.getElementById("bar").style.width = (opened.size / gifts.length * 100) + "%";
  }
  update();

  document.getElementById("reset").addEventListener("click", () => {
    opened.clear(); save();
    document.querySelectorAll(".gift").forEach((b, i) => {
      b.classList.remove("open");
      b.setAttribute("aria-label", "Ouvrir l’enveloppe " + (i + 1));
    });
    update();
  });

  // confetti
  const cv = document.getElementById("confetti"), ctx = cv.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let parts = [], running = false;
  function size() { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); }
  size(); addEventListener("resize", size);
  const cols = ["#C8A35F", "#EAD3A0", "#F6E6C2", "#FBF4E8", "#A8314E"];
  function burst(x, y, n) {
    if (reduce) return;
    for (let k = 0; k < n; k++) {
      const a = Math.random() * Math.PI * 2, s = 3 + Math.random() * 7;
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 4, r: 3 + Math.random() * 4,
        c: cols[k % cols.length], rot: Math.random() * 6, vr: (Math.random() - .5) * .3, life: 0 });
    }
    if (!running) { running = true; requestAnimationFrame(tick); }
  }
  function tick() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter(p => p.life < 110);
    parts.forEach(p => {
      p.vy += .18; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life++;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.globalAlpha = Math.max(0, 1 - p.life / 110);
      ctx.fillStyle = p.c; ctx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r);
      ctx.restore();
    });
    if (parts.length) requestAnimationFrame(tick); else { running = false; ctx.clearRect(0,0,innerWidth,innerHeight); }
  }
</script>
</body>
</html>
